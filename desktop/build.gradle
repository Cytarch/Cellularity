/*
 * Cellularity source code.
 *
 * The Windows desktop launcher.
 *
 * It is a plain JVM module rather than another Kotlin Multiplatform target, because
 * there is nothing here to share: the UI it drives already lives in :shared, which
 * compiles for the JVM unchanged. What this module owns is the desktop-only layer --
 * the application window, the JVM implementations of the file and settings seams the
 * Android app implements against Android APIs, and the native bridge to the renderer.
 */

plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.compose.multiplatform)
}

kotlin {
    jvmToolchain(libs.versions.jdk.get().toInteger())
    compilerOptions {
        jvmTarget.set(
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                libs.versions.jvmTarget.get()
            )
        )
    }
}

// The toolchain is the project JDK, but the bytecode target follows the same
// convention as :shared, so a jar built here stays loadable by the JVM target the
// rest of the project compiles against.
java {
    sourceCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
    targetCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
}

dependencies {
    implementation(project(':shared'))

    implementation(compose.desktop.currentOs)
    implementation(compose.runtime)
    implementation(compose.foundation)
    implementation(compose.material3)
    implementation(compose.materialIconsExtended)
    implementation(libs.kotlinx.coroutines.core)
    implementation(libs.kotlinx.serialization.json)

    testImplementation(libs.junit)
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit"
}

// The renderer is a CMake target, so it lands in the build tree where neither the JVM
// nor the Windows loader would look for it. Pointing both at that directory is what lets
// the integration test exercise the real library instead of skipping itself; an installed
// build has the library on the default search path and does not need this.
def nativeOutputDirectory = rootProject.file('build/win-cmake')
if (nativeOutputDirectory.isDirectory()) {
    tasks.withType(Test).configureEach {
        systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
        environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
        environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
    }

    dependencies {
        // The launcher's own integration tests build the interface on a real AWT frame,
        // which needs the window and the test harness rather than only the JVM target.
        testImplementation compose.desktop.currentOs
        testImplementation compose.uiTestJUnit4
    }
}

// AWT keeps the native window handle behind a package-private field, and the package is
// not exported by default. Opening it for the test process is what allows the handle
// lookup to be exercised at all; the production launch does not need this because it only
// reflects over public methods.
tasks.withType(Test).configureEach {
    jvmArgs += [
        '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt.peer=ALL-UNNAMED',
        '--add-exports', 'java.desktop/java.awt.peer=ALL-UNNAMED',
        '--add-exports', 'java.desktop/sun.awt.windows=ALL-UNNAMED'
    ]
}

// AWT keeps the native window handle behind a package-private field, and JDK 21 removed
// the accessor that used to expose it. Reading the field is what lets the renderer find
// the window to present into, so the module has to be opened for the launched process.
// JDK_JAVA_OPTIONS is used rather than a task option because it reaches the JVM however
// it was started -- under `run`, from a packaged launcher, or by hand -- and a flag that
// only applies to one of those would make the app work in development and fail when
// installed.
def requiredOpens = '-XX:+IgnoreUnrecognizedVMOptions ' +
        '--add-opens=java.desktop/java.awt=ALL-UNNAMED ' +
        '--add-exports=java.desktop/sun.awt.windows=ALL-UNNAMED'
def existingJavaOptions = System.getenv('JDK_JAVA_OPTIONS')
if (existingJavaOptions == null || !existingJavaOptions.contains('java.desktop/java.awt')) {
    tasks.withType(JavaExec).configureEach {
        environment 'JDK_JAVA_OPTIONS', existingJavaOptions == null
                ? requiredOpens
                : "${existingJavaOptions} ${requiredOpens}"
    }
}

// Measures whether the event thread is still being serviced while the simulation runs. A
// frozen window is a claim about that one thread, and it is checkable without looking at
// anything: post work to its queue and time the round trip. The plate is composed exactly as
// the play screen composes it, and taken off screen and put back, because that is what
// switching tabs does and it is the state the window-based design could not survive.
tasks.register('runResponsivenessProbe', JavaExec) {
    group = 'verification'
    description = 'Measures whether the interface answers while the simulation is running.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.ResponsivenessProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// Opens an experiment and stays up, parked outside every monitor, so the window can be measured
// from another process while it runs. Whether the application answers the system, what a click on
// the viewport reaches, and whether the picture gets out of the way when another tab opens are
// facts about the windows as the rest of Windows sees them -- a process cannot ask that about
// itself without trusting the code it is checking. This probe puts the interface into the state
// worth measuring and reports on a timer; everything else is measured against it from outside.

// Measures one frame of the world: how long it takes to get from the renderer to pixels the
// interface can draw, and how much the process grows while that happens a few hundred times.
// The measurement is the point -- the two paths differ by one window-sized copy per frame and
// one image per frame, and only numbers can say whether that matters.
tasks.register('runFrameCostProbe', JavaExec) {
    group = 'verification'
    description = 'Measures the cost per frame of each way of getting a frame to the screen.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.nativebridge.FrameCostProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}
// Photos the editor's own preview panel: the editor is composed offscreen, an organism is grown
// in it, the wheel is turned over the panel, and both frames are measured and written out. A
// preview whose camera is never asked for a frame looks exactly like a working one until somebody
// tries to move it, so what the wheel changed is the measurement.
tasks.register('runGenomeEditorPreview', JavaExec) {
    group = 'verification'
    description = 'Composes the genome editor, zooms its preview, and photographs both frames.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.GenomeEditorPreviewProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// Opens the application with a file, the way Windows does when a person chooses Cellularity in
// "Open with", and photographs the pages the import lands in. The data directory is the probe's
// own, so a check of the import cannot touch the collection the person running it has saved.
tasks.register('runImportProbe', JavaExec) {
    group = 'verification'
    description = 'Imports a genome and a plate as command-line arguments and photographs the pages.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.ImportProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_DATA_DIR',
        layout.projectDirectory.dir('build/diagnostics/import-check/data').asFile.absolutePath
    // A plate with a body cannot be written by this side, so a real one is handed in when there is
    // one to hand in: -PopenedPlate=... makes the probe import it and open the world it holds.
    environment 'CELLULARITY_PROBE_PLATE',
        providers.gradleProperty('openedPlate').getOrElse('')
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// Saves a running plate and opens what was saved. A plate with a body cannot be written by this
// side, so a real one is handed in with -PopenedPlate=... and the probe saves *that* world under a
// name of its own: what is measured is the save and the file that comes out of it, not the plate
// that went in.
tasks.register('runSaveProbe', JavaExec) {
    group = 'verification'
    description = 'Saves a running plate, opens the saved file and measures both.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.SaveProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_DATA_DIR',
        layout.projectDirectory.dir('build/diagnostics/save-check/data').asFile.absolutePath
    environment 'CELLULARITY_PROBE_PLATE',
        providers.gradleProperty('openedPlate').getOrElse('')
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}
// Starts the application itself with a file on its command line, which is what Windows does when a
// person chooses Cellularity in "Open with" or double-clicks a saved plate. This is not a test: the
// window it opens is the real application, and what it is watched for is what it did with the file
// -- the observation is the collection, not an assertion. The data directory is the probe's own so
// that watching an import cannot disturb the collection the person running it has saved; pass
// -PcellularityDataDir=... to point it elsewhere, and -PopenedFile=... for the file to open.
tasks.register('runDesktopWithFile', JavaExec) {
    group = 'verification'
    description = 'Starts the desktop application with a file argument, as "Open with" does.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.MainKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_DATA_DIR', providers.gradleProperty('cellularityDataDir').getOrElse(
        layout.projectDirectory.dir('build/diagnostics/open-with/data').asFile.absolutePath
    )
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
    if (project.hasProperty('openedFile')) {
        args = [project.property('openedFile').toString()]
    }
}

// Draws the organism a genome grows into and writes it out as a picture, so the genome editor's
// preview is checked by looking at what it would show rather than by trusting a status code.
tasks.register('runGenomePreviewProbe', JavaExec) {
    group = 'verification'
    description = 'Draws the organism of a genome taken from the plate and writes it as a picture.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.GenomePreviewProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}
// Runs the play screen in a window so it can be watched while it draws. This is not a
// test: it is the last step of the port that no assertion covers, because the journey
// from the menu into a running plate is something only a window can show. Keeping it as a
// task rather than a test means the suite stays free of a ten-minute sleep.
tasks.register('runPlayScreen', JavaExec) {
    group = 'verification'
    description = 'Opens the desktop play screen on a live simulation, for observation.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.PlayScreenProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// Walks the whole user journey -- menu, experiment, tabs, dialog, leaving -- and reports the state
// after every step. Each step has been photographed separately; the sequence is what this checks.
tasks.register('runUserJourney', JavaExec) {
    group = 'verification'
    description = 'Walks the experiment journey through the play state machine and reports each step.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.UserJourneyProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}
// Drives the genome editor the way a person would and photographs each section. An editor
// that composes but discards its input looks finished from the outside, so this checks that
// an edit reached the reducer as well as writing the pictures; the pictures are still for a
// person to look at, because no assertion can say whether a layout is right.
tasks.register('runGenomeEditor', JavaExec) {
    group = 'verification'
    description = 'Opens the desktop genome editor, drives it, and captures each section.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.GenomeEditorProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// Opens and closes the substrate panel on a running world. A screen that is composed only
// while its tab is showing is the classic way to make Compose fail on a group mismatch, and
// it fails when the tab is first opened rather than at build time, so the toggling is what
// this checks; the picture is of the world it ended up reading.
tasks.register('runSubstrateTab', JavaExec) {
    group = 'verification'
    description = 'Toggles the desktop substrate panel on a live simulation and captures it.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.SubstrateTabProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// The renderer's native half is built by CMake into the build tree, where a packaged
// application can never find it: the JVM searches the library path, the native loader
// searches the executable's directory, and neither of those is build/win-cmake. The
// shaders and textures have the same problem for the same reason -- the discovery a
// development run uses walks up from the working directory, and a packaged launch has no
// working directory it can rely on.
//
// So the three of them are staged into a directory Compose Desktop turns into
// $APPDIR/resources, in a layout the runtime knows (see DesktopNativeRenderer and
// DesktopAssetRoots). The plugin's own prepareAppResources task syncs <root>/common,
// <root>/<os> and <root>/<target> from appResourcesRootDir, so staging below windows-x64 --
// the target id for this machine -- puts the tree at resources/native/... in the
// distributable, and -Dcompose.application.resources.dir=$APPDIR/resources, which the
// generated launcher config already carries, is all the plumbing it needs.
//
// The shaders keep the directory they are generated in. The renderer asks its asset root
// for `vulkan/shaders/<name>` -- that relative path is fixed in the native backend, and
// the host build tree carries it at
// build/win-cmake/generated/vulkanShaders/host/assets/vulkan/shaders -- so copying the
// .spv files alone into a directory of their own would produce a package whose shader root
// exists and holds nothing the renderer will open.
//
// The copy is deliberately forgiving. CMake is built separately and by hand, so the files
// may legitimately not exist yet: the task packages whatever is there and names each missing
// input together with the command that produces it. Failing the build would make a
// distributable impossible to produce before the native side is compiled, and saying nothing
// would produce one that cannot render and give no reason why.
def nativeLibraryCommand = 'cmake --build build/win-cmake'
def cmakeOutputDirectory = rootProject.file('build/win-cmake')
def textureSourceDirectory = rootProject.file('native/rendering/assets/textures')
def shaderSourceDirectory =
        rootProject.file('build/win-cmake/generated/vulkanShaders/host/assets')

// Owned by this build rather than by the Compose plugin, because the plugin creates its own
// resource task too late in configuration to be asked for its output directory here.
def packagedResourcesDirectory = layout.buildDirectory.dir('compose/nativeAppResources')
def packagedTargetDirectory = packagedResourcesDirectory.map { it.dir('windows-x64') }
def packagedNativeDirectory = packagedTargetDirectory.map { it.dir('native') }

/** The regular files directly inside [directory], or none when it is not there yet. */
def filesIn = { File directory, String pattern ->
    directory.isDirectory()
            ? (directory.listFiles() ?: new File[0])
            .findAll { it.isFile() && it.name ==~ pattern }
            .sort { it.name }
            : []
}

// Everything the renderer needs at run time, as source files whose names are the names they
// keep in the packaged resources. The two Vulkan-support libraries are here because
// cellularity_desktop.dll imports them by name: it needs vulkan-1.dll for the loader and
// z.dll for the archive reader, and neither is part of a JRE image, so a packaged launch
// would otherwise pick up a system copy or fail outright.
def nativeRuntimeFileNames = ['cellularity_desktop.dll', 'vulkan-1.dll', 'z.dll']
def nativeRuntimeFiles =
        nativeRuntimeFileNames.collect { new File(cmakeOutputDirectory, it) }
def nativeShaderFiles = filesIn(new File(shaderSourceDirectory, 'vulkan/shaders'), /(?i).*\.spv/)
def nativeTextureFiles = filesIn(textureSourceDirectory, /(?i).*\.png/)

// The staged tree the runtime expects. A contribution whose sources are absent is still
// declared: copying nothing is what makes the packaging step succeed with a warning rather
// than refuse to run before the native side has been compiled.
def stagedNativeContributions = [
        [sources: nativeRuntimeFiles, target: 'native'],
        [sources: nativeShaderFiles, target: 'native/vulkan/shaders'],
        [sources: nativeTextureFiles, target: 'native/textures']
]

// Named at configuration time rather than inside the task action, so the warning can say
// which files are absent without the task reaching back into the project while it runs.
def missingNativeAssets = []
nativeRuntimeFiles.each { source ->
    if (!source.isFile()) {
        missingNativeAssets.add("'${source.name}' (${source.absolutePath})".toString())
    }
}
if (nativeShaderFiles.isEmpty()) {
    missingNativeAssets.add(
        "'compiled shaders (*.spv) under ${shaderSourceDirectory.absolutePath}'".toString()
    )
}
if (nativeTextureFiles.isEmpty()) {
    missingNativeAssets.add(
        "'renderer textures (*.png) under ${textureSourceDirectory.absolutePath}'".toString()
    )
}
def stagedNativeAssetCount =
        nativeRuntimeFiles.count { it.isFile() } +
                nativeShaderFiles.size() +
                nativeTextureFiles.size()
def stagedNativeAssetRoot = packagedNativeDirectory.get().asFile.absolutePath

// A Sync whose input files are all absent is skipped as NO-SOURCE without running its
// action, and "nothing has been compiled yet" is exactly that case. One file that is
// certainly there is mixed into the contributions so the task always has something to read
// and the warnings below always get their chance to speak: this build script, which Gradle
// has just read. It costs one extra byte-for-byte copy into the resources directory.
def buildScriptFile = buildFile

def stageNativeAssets = tasks.register('stageNativeAssets', Sync) {
    group = 'build'
    description = 'Stages the renderer library, shaders and textures for the distributable.'
    stagedNativeContributions.each { contribution ->
        from(contribution.sources) {
            into contribution.target
        }
    }
    from(buildScriptFile)
    into { packagedTargetDirectory.get().asFile }
    // build/win-cmake is written by hand rather than by Gradle, so there is nothing here
    // that would let the task be safely reused between builds.
    outputs.upToDateWhen { false }

    doLast {
        if (stagedNativeAssetCount == 0) {
            logger.warn(
                "Cellularity packaging: no native renderer assets were staged, so the " +
                    "distributable will start but cannot draw a simulation."
            )
        }
        missingNativeAssets.each { missing ->
            logger.warn(
                "Cellularity packaging: ${missing} is not in the build tree, so it will " +
                    "not be in the distributable and the packaged application will report " +
                    "the renderer as unavailable. Produce it with: ${nativeLibraryCommand}"
            )
        }
        if (stagedNativeAssetCount > 0) {
            logger.lifecycle(
                "Cellularity packaging: staged ${stagedNativeAssetCount} renderer file(s) " +
                    "into ${stagedNativeAssetRoot}"
            )
        }
    }
}

compose.desktop {
    application {
        mainClass = 'com.cytarch.cellularity.desktop.MainKt'

        // The application reads the package-private AWT peer field to find the native
        // window to present into, and JDK 21 removed the accessor that used to make that
        // unnecessary. These reach the JVM only through JDK_JAVA_OPTIONS today, which the
        // Gradle launch tasks set and a packaged launcher does not inherit, so without
        // them here the packaged application finds no window handle and shows the
        // renderer-unavailable message instead of a picture.
        jvmArgs(*(requiredOpens.split(' ').findAll { !it.isBlank() } as String[]))

        nativeDistributions {
            targetFormats(
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi
            )
            packageName = 'Cellularity'
            packageVersion = libs.versions.appVersionName.get().replaceAll(/-.*$/, '')
            description = 'Cellularity microscope simulation'
            vendor = 'Cytarch'

            appResourcesRootDir.set(packagedResourcesDirectory)
        }
    }
}

// The plugin's resource task is the only reader of appResourcesRootDir, and it has to run
// after the staging rather than before it. It is looked up after this project has been
// evaluated because that is when the Compose plugin registers it; the name is built from the
// build type, so a version of the plugin that renamed it should say so here rather than fail
// a build whose assets would silently be left out.
afterEvaluate {
    def appResourcesTaskName = 'prepareAppResources'
    def appResourcesTasks = tasks.matching { it.name == appResourcesTaskName }
    if (appResourcesTasks.isEmpty()) {
        logger.warn(
            "Cellularity packaging: no '${appResourcesTaskName}' task exists, so the staged " +
                "renderer assets will not reach appResourcesRootDir. Check the task names " +
                "the Compose Gradle plugin ${libs.versions.composeMultiplatform.get()} " +
                "generates."
        )
    }
    appResourcesTasks.configureEach {
        dependsOn stageNativeAssets
    }
}

// Everything that turns the prepared resources into an application image waits for the
// renderer files to be added to them. Naming the tasks by string lets Gradle resolve the
// dependency while it builds the graph, so each one gets it whether or not it is being run.
[
        'createDistributable',
        'packageDistributionForCurrentOS',
        'packageMsi',
        'packageReleaseDistributionForCurrentOS',
        'packageReleaseMsi',
        'runDistributable'
].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn stageNativeAssets
    }
}
