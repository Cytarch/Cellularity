/*
 * Cellularity source code.
 *
 * The Windows desktop launcher.
 *
 * It is a plain JVM module rather than another Kotlin Multiplatform target, because
 * there is nothing here to share: the UI it drives already lives in :shared, which
 * compiles for the JVM unchanged. What this module owns is the desktop-only layer --
 * the application window, the JVM implementations of the file and settings seams the
 * Android app implements against Android APIs, and the native bridge to the renderer.
 */

plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.compose.multiplatform)
}

kotlin {
    jvmToolchain(libs.versions.jdk.get().toInteger())
    compilerOptions {
        jvmTarget.set(
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                libs.versions.jvmTarget.get()
            )
        )
    }
}

// The toolchain is the project JDK, but the bytecode target follows the same
// convention as :shared, so a jar built here stays loadable by the JVM target the
// rest of the project compiles against.
java {
    sourceCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
    targetCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
}

dependencies {
    implementation(project(':shared'))

    implementation(compose.desktop.currentOs)
    implementation(compose.runtime)
    implementation(compose.foundation)
    implementation(compose.material3)
    implementation(compose.materialIconsExtended)
    implementation(libs.kotlinx.coroutines.core)
    implementation(libs.kotlinx.serialization.json)

    testImplementation(libs.junit)
}

// The renderer is a CMake target, so it lands in the build tree where neither the JVM
// nor the Windows loader would look for it. Pointing both at that directory is what lets
// the integration test exercise the real library instead of skipping itself; an installed
// build has the library on the default search path and does not need this.
def nativeOutputDirectory = rootProject.file('build/win-cmake')
if (nativeOutputDirectory.isDirectory()) {
    tasks.withType(Test).configureEach {
        systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
        environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
        environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
    }

    dependencies {
        // The launcher's own integration tests build the interface on a real AWT frame,
        // which needs the window and the test harness rather than only the JVM target.
        testImplementation compose.desktop.currentOs
        testImplementation compose.uiTestJUnit4
    }
}

// AWT keeps the native window handle behind a package-private field, and the package is
// not exported by default. Opening it for the test process is what allows the handle
// lookup to be exercised at all; the production launch does not need this because it only
// reflects over public methods.
tasks.withType(Test).configureEach {
    jvmArgs += [
        '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED',
        '--add-opens', 'java.desktop/java.awt.peer=ALL-UNNAMED',
        '--add-exports', 'java.desktop/java.awt.peer=ALL-UNNAMED',
        '--add-exports', 'java.desktop/sun.awt.windows=ALL-UNNAMED'
    ]
}

// AWT keeps the native window handle behind a package-private field, and JDK 21 removed
// the accessor that used to expose it. Reading the field is what lets the renderer find
// the window to present into, so the module has to be opened for the launched process.
// JDK_JAVA_OPTIONS is used rather than a task option because it reaches the JVM however
// it was started -- under `run`, from a packaged launcher, or by hand -- and a flag that
// only applies to one of those would make the app work in development and fail when
// installed.
def requiredOpens = '-XX:+IgnoreUnrecognizedVMOptions ' +
        '--add-opens=java.desktop/java.awt=ALL-UNNAMED ' +
        '--add-exports=java.desktop/sun.awt.windows=ALL-UNNAMED'
def existingJavaOptions = System.getenv('JDK_JAVA_OPTIONS')
if (existingJavaOptions == null || !existingJavaOptions.contains('java.desktop/java.awt')) {
    tasks.withType(JavaExec).configureEach {
        environment 'JDK_JAVA_OPTIONS', existingJavaOptions == null
                ? requiredOpens
                : "${existingJavaOptions} ${requiredOpens}"
    }
}

// Runs the play screen in a window so it can be watched while it draws. This is not a
// test: it is the last step of the port that no assertion covers, because the journey
// from the menu into a running plate is something only a window can show. Keeping it as a
// task rather than a test means the suite stays free of a ten-minute sleep.
tasks.register('runPlayScreen', JavaExec) {
    group = 'verification'
    description = 'Opens the desktop play screen on a live simulation, for observation.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.PlayScreenProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// Drives the genome editor the way a person would and photographs each section. An editor
// that composes but discards its input looks finished from the outside, so this checks that
// an edit reached the reducer as well as writing the pictures; the pictures are still for a
// person to look at, because no assertion can say whether a layout is right.
tasks.register('runGenomeEditor', JavaExec) {
    group = 'verification'
    description = 'Opens the desktop genome editor, drives it, and captures each section.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.GenomeEditorProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

// Opens and closes the substrate panel on a running world. A screen that is composed only
// while its tab is showing is the classic way to make Compose fail on a group mismatch, and
// it fails when the tab is first opened rather than at build time, so the toggling is what
// this checks; the picture is of the world it ended up reading.
tasks.register('runSubstrateTab', JavaExec) {
    group = 'verification'
    description = 'Toggles the desktop substrate panel on a live simulation and captures it.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cytarch.cellularity.desktop.SubstrateTabProbeKt'
    environment 'JDK_JAVA_OPTIONS', "${existingJavaOptions ?: ''} ${requiredOpens}".trim()
    systemProperty 'java.library.path', nativeOutputDirectory.absolutePath
    environment 'CELLULARITY_NATIVE_DIR', nativeOutputDirectory.absolutePath
    environment 'PATH', "${nativeOutputDirectory.absolutePath};${System.getenv('PATH')}"
}

compose.desktop {
    application {
        mainClass = 'com.cytarch.cellularity.desktop.MainKt'

        nativeDistributions {
            targetFormats(
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi
            )
            packageName = 'Cellularity'
            packageVersion = libs.versions.appVersionName.get().replaceAll(/-.*$/, '')
            description = 'Cellularity microscope simulation'
            vendor = 'Cytarch'
        }
    }
}
