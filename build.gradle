/*
 * Cellularity source code.
 */

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.kotlin.multiplatform.library) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.compose.multiplatform) apply false
}

def requiredBuildJavaVersion = JavaVersion.toVersion(libs.versions.jdk.get())
if (JavaVersion.current() != requiredBuildJavaVersion) {
    throw new GradleException(
        "Cellularity requires JDK ${requiredBuildJavaVersion.majorVersion} as the Gradle runtime; " +
            "current runtime is ${JavaVersion.current().majorVersion}."
    )
}
