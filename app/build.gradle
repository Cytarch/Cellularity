plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

apply from: rootProject.file('gradle/vulkan-shaders.gradle')

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
            libs.versions.jvmTarget.get()
        )
    }
}

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()
    ndkVersion = libs.versions.ndk.get()

    defaultConfig {
        applicationId = "com.cytarch.cellularity"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        buildConfigField 'boolean', 'ENABLE_RENDER_PROFILING', 'false'

        versionCode = libs.versions.appVersionCode.get().toInteger()
        versionName = libs.versions.appVersionName.get()

        externalNativeBuild {
            cmake {
                arguments '-DCELLULARITY_DEFAULT_OVERLAP_SCAN_ALGORITHM=incremental-bucketed-f64-source32',
                        '-DCELLULARITY_ENABLE_PERFORMANCE_HUD=ON'
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled = false
            shrinkResources = false
            pseudoLocalesEnabled = true
            buildConfigField 'boolean', 'ENABLE_RENDER_PROFILING', 'true'
            externalNativeBuild {
                cmake {
                    arguments '-DCELLULARITY_ENABLE_VULKAN_PROFILING=ON'
                }
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        performance {
            // Release-equivalent code, signed with the local debug key for
            // optional target-specific performance diagnostics.
            initWith release
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'ENABLE_RENDER_PROFILING', 'true'
            externalNativeBuild {
                cmake {
                    arguments '-DCELLULARITY_ENABLE_VULKAN_PROFILING=ON'
                }
            }
        }
        experimental {
            // Release-equivalent build signed with the local debug key for
            // experimental native features and on-device diagnostics.
            initWith release
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
            versionNameSuffix = '-experimental'
            buildConfigField 'boolean', 'ENABLE_RENDER_PROFILING', 'true'
            externalNativeBuild {
                cmake {
                    arguments '-DCELLULARITY_ENABLE_VULKAN_PROFILING=ON'
                }
            }
        }
    }


    buildFeatures {
        buildConfig = true
        compose = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    namespace = 'com.cytarch.cellularity'
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
    }
    externalNativeBuild {
        cmake {
            path = rootProject.file('native/CMakeLists.txt')
            version = libs.versions.cmake.get()
        }
    }
    sourceSets {
        main.assets.srcDir rootProject.file('native/rendering/assets')
        test.resources.srcDir rootProject.file('native/tests/fixtures/corpus')
        test.resources.srcDir rootProject.file('testdata/release-format')
        debug.java.srcDir 'src/diagnostic/java'
        debug.kotlin.srcDir 'src/diagnostic/java'
        debug.manifest.srcFile 'src/diagnostic/AndroidManifest.xml'
        performance.java.srcDir 'src/diagnostic/java'
        performance.kotlin.srcDir 'src/diagnostic/java'
        performance.manifest.srcFile 'src/diagnostic/AndroidManifest.xml'
        experimental.java.srcDir 'src/diagnostic/java'
        experimental.kotlin.srcDir 'src/diagnostic/java'
        experimental.manifest.srcFile 'src/diagnostic/AndroidManifest.xml'
    }
}

dependencies {
    implementation project(':shared')

    implementation(libs.androidx.compose.foundation)
    implementation(libs.androidx.compose.runtime.saveable)
    testImplementation(libs.junit)

    // AndroidX compatibility components.
    implementation(libs.androidx.appcompat)

    // Core Compose UI.
    implementation(libs.androidx.compose.ui)
    implementation(libs.androidx.compose.material3)

    // Compose-aware ViewModel access and lifecycle state collection.
    implementation(libs.androidx.lifecycle.viewmodel.compose)
    implementation(libs.androidx.lifecycle.runtime.compose)

    // Compose Activity integration.
    implementation(libs.androidx.activity.compose)

    implementation(libs.androidx.compose.ui.tooling.preview)
    debugImplementation(libs.androidx.compose.ui.tooling)

    implementation(libs.androidx.compose.material.icons.extended)

    constraints {
        implementation(libs.androidx.compose.animation)
        implementation(libs.androidx.compose.animation.core)
        implementation(libs.androidx.compose.foundation.layout)
        implementation(libs.androidx.compose.material.ripple)
        implementation(libs.androidx.compose.runtime)
        implementation(libs.androidx.lifecycle.runtime)
        implementation(libs.androidx.activity)
        implementation(libs.androidx.core)
        implementation(libs.androidx.core.ktx)
    }

}
